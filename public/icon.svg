<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Gradient for the Hexagon Shape -->
                <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#64748b;stop-opacity:1"></stop>
                    <stop offset="100%" style="stop-color:#020617;stop-opacity:1"></stop>
                </linearGradient>
                
                <!-- Inner stroke gradient -->
                <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#475569;stop-opacity:1"></stop>
                    <stop offset="100%" style="stop-color:#64748b;stop-opacity:1"></stop>
                </linearGradient>

                <!-- Text Shadow Filter for portability -->
                <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur"></feGaussianBlur>
                    <feOffset in="blur" dx="0" dy="2" result="offsetBlur"></feOffset>
                    <feComponentTransfer>
                        <feFuncA type="linear" slope="0.3"></feFuncA>
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode in="offsetBlur"></feMergeNode>
                        <feMergeNode in="SourceGraphic"></feMergeNode>
                    </feMerge>
                </filter>
            </defs>

            <!-- 
                Hexagon Path (Pointy Top)
                Calculated to fit within 100x100 with some padding
            -->
            <path d="M50 5 
                     L89 27.5 
                     L89 72.5 
                     L50 95 
                     L11 72.5 
                     L11 27.5 
                     Z" fill="url(#hexGradient)" stroke="url(#borderGradient)" stroke-width="2" stroke-linejoin="round"></path>

            <!-- Typography -->
            <text x="50" y="50" text-anchor="middle" dominant-baseline="central" font-family="'JetBrains Mono', monospace" style="user-select: none;">
                <!-- The large Sigma -->
                <tspan fill="#ffffff" font-weight="800" filter="url(#textShadow)" font-size="60" dx="-2">Σ</tspan>
                <!-- The numbers -->
                <tspan fill="#7fd1ff" font-weight="800" font-size="32" dx="-17" dy="0" letter-spacing="-3">16</tspan>
            </text>
        </svg>